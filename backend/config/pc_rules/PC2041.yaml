profit_center: PC2041
rules:
  - key: pc2041.retention.issued_only
    kind: filter
    scope_file_like: "*Preferra Production*"
    scope_sheet: Renewal
    enabled: false
    spec:
      keep: {op: eq, args: ["src:Renewal Sales Cycle Status", ISSUED]}
    note: >-
      Disabled: no July PC2041 file has 'Renewal Sales Cycle Status' (the Preferra Renewal
      sheet has 'Policy Status'). Confirm with the business which column and value mean
      'issued' before switching it on.
    source_ref: ext_pc2041_retention_silver_cleansed.py:330-341
  - key: pc2041.retention.transaction_detail
    kind: constant
    scope_file_like: "*Preferra Production*"
    scope_sheet: Renewal
    column: transaction_detail
    spec: {value: Renewal}
    source_ref: ext_pc2041_retention_silver_cleansed.py:748
  - key: pc2041.retention.renewal_flag
    kind: constant
    scope_file_like: "*Preferra Production*"
    scope_sheet: Renewal
    column: renewal_flag
    spec: {value: true}
    source_ref: ext_pc2041_retention_silver_cleansed.py:765
  - key: pc2041.preferra_new.transaction_detail
    kind: constant
    scope_file_like: "*Preferra Production*"
    scope_sheet: New
    column: transaction_detail
    spec: {value: New Business}
    source_ref: ext_pc2041_preferra_new_business_silver_cleansed.py:737
  - key: pc2041.preferra_new.renewal_flag
    kind: constant
    scope_file_like: "*Preferra Production*"
    scope_sheet: New
    column: renewal_flag
    spec: {value: false}
    source_ref: ext_pc2041_preferra_new_business_silver_cleansed.py:754
  - key: pc2041.ajg_renewals.policy_status
    kind: translate
    scope_file_like: "*AHI Data Request*"
    scope_sheet: AJG Renewals
    column: policy_status
    spec:
      source: "src:Result"
      cases: [{when: successful, then: Renewed}]
      default: Not Renewed
    note: "A blank Result stays blank."
    source_ref: ext_pc2041_ajg_renewals_cleansed.py:643-652
  - key: pc2041.ajg_new_business.expiration
    kind: derive
    scope_file_like: "*AHI Data Request*"
    scope_sheet: AJG New Business
    column: policy_expiration_date
    spec:
      expr: {op: add_months, args: ["silver:policy_effective_date"], months: 12}
    source_ref: ext_pc2041_new_business_cleansed.py:645
  - key: pc2041.ajg.agent_address
    kind: lookup
    scope_file_like: "*AHI Data Request*"
    scope_sheet: AJG*
    spec:
      source: inline
      key: "silver:producer_agency_name"
      match: contains
      mode: fill_null
      columns:
        producer_billing_address: address
        producer_billing_city: city
        producer_billing_state: state
        producer_billing_zipcode: zip
      entries:
        - {key: "Arthur J. Gallagher Risk Management Services, Inc. - Travis Cutter", address: "220 Emerson Place STE 200", city: Davenport, state: IA, zip: "52801"}
        - {key: "Arthur J Gallagher - Chip Treadway", address: "1300 S Main Street", city: Tulsa, state: OK, zip: "74119"}
    source_ref: ext_pc2041_ajg_renewals_cleansed.py:805-822
