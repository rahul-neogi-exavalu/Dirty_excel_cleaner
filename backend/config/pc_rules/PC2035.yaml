profit_center: PC2035
rules:
  - key: pc2035.gallagher.producer_commission_pct
    kind: constant
    scope_file_like: "*Gallagher Report*"
    column: producer_commission_pct
    spec: {value: 0.15}
    source_ref: ext_pc2035_data_silver_cleansed.py:685
  - key: pc2035.gallagher.producer_commission_amount
    kind: derive
    scope_file_like: "*Gallagher Report*"
    column: producer_commission_amount
    spec:
      expr: {op: mul, args: ["src:Gross Specific", 0.15]}
    source_ref: ext_pc2035_data_silver_cleansed.py:686
  - key: pc2035.gallagher.policyholder_address
    kind: lookup
    scope_file_like: "*Gallagher Report*"
    spec:
      source: inline
      key: "src:Policyholder"
      match: contains
      columns:
        producer_billing_address: address
        producer_billing_city: city
        producer_billing_state: state
        producer_billing_zipcode: zip
        producer_office_location: address
        producer_office_city: city
        producer_office_state: state
        producer_office_zipcode: zip
      entries:
        - {key: MTF BIOLOGICS, address: "200 Jefferson Park", city: Whippany, state: NJ, zip: "07981"}
        - {key: B.L. DOWNEY, address: "2850 Golf Road", city: Rolling Meadows, state: IL, zip: "60008"}
        - {key: EHOB, address: "2850 Golf Road", city: Rolling Meadows, state: IL, zip: "60008"}
    note: "The notebook calls this a temporary solution."
    source_ref: ext_pc2035_data_silver_cleansed.py:655-696
